worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/faiveley-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/faiveley-client-body;
    proxy_temp_path /tmp/faiveley-proxy;
    fastcgi_temp_path /tmp/faiveley-fastcgi;
    uwsgi_temp_path /tmp/faiveley-uwsgi;
    scgi_temp_path /tmp/faiveley-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location = / {
            add_header Cache-Control no-store;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy same-origin;
            try_files /index.html =404;
        }

        location /portal-assets/ {
            try_files $uri =404;
        }

        location = /gestion { return 308 /gestion/; }
        location = /production { return 308 /production/; }
        location = /manutention { return 308 /manutention/; }
        location = /qualite { return 308 /qualite/; }
        location = /techniciens { return 308 /techniciens/; }

        location /gestion/ {
            set $dashboard dashboard:8000;
            proxy_pass http://$dashboard$request_uri;
        }

        location /production/ {
            set $production production:8000;
            proxy_pass http://$production$request_uri;
        }

        location /manutention/ {
            set $manutention manutention:8000;
            proxy_pass http://$manutention$request_uri;
        }

        location /qualite/ {
            set $qualite qualite:8000;
            proxy_pass http://$qualite$request_uri;
        }

        location /techniciens/ {
            set $techniciens techniciens:8000;
            proxy_pass http://$techniciens$request_uri;
        }

        location / {
            return 404;
        }
    }
}