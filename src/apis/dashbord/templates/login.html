<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion | FaiveleyTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('environment_navigation.static', filename='environment-navigation.css') }}">
</head>
<body class="login-page">
    <main class="login-panel">
        <p class="brand">FAIVELEYTECH<span>Gestion industrielle</span></p>
        <h1>Connexion</h1>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Identifiant</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}
            <button type="submit">Ouvrir la session</button>
        </form>
        <div class="environment-login-navigation">
            {% include 'fragments/environment_selector.html' %}
        </div>
    </main>
</body>
</html>
