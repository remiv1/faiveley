services:
  db-main:
    container_name: faiv-db
    build:
      context: .
      dockerfile: src/database/dockerfile.postgres
    env_file:
      - src/database/.env.postgres
    networks:
      - faiv-network
      - faiv-secure
      - faiv-migrations
    volumes:
      - faiv-db-data:/var/lib/postgresql
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres} -h localhost -p 5432 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  faiv-db-data:
    driver: local

networks:
  faiv-network:
    driver: bridge
  faiv-secure:
    driver: bridge
  faiv-migrations:
    driver: bridge