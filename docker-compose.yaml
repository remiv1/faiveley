services:
  db-main:
    container_name: faiv-db
    build:
      context: .
      dockerfile: src/database/dockerfile.postgres
    env_file:
      - src/database/.env.postgres
    networks:
      - faiv-network
      - faiv-secure
      - faiv-migrations
    volumes:
      - faiv-db-data:/var/lib/postgresql
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres} -h localhost -p 5432 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  production:
    container_name: faiv-production
    build:
      context: .
      dockerfile: src/apis/production/dockerfile.prod
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - faiv-network
    restart: on-failure:5
    ports:
      - "8000:8000"

  manutention:
    container_name: faiv-manutention
    build:
      context: .
      dockerfile: src/apis/manutention/dockerfile.manut
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - faiv-network
    restart: on-failure:5
    ports:
      - "8001:8000"

  techniciens:
