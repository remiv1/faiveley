services:
  proxy:
    image: nginx:1.28-alpine
    container_name: plast-proxy
    ports:
      - "8110:8080"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: "^NGINX_LOCAL_RESOLVERS$"
    volumes:
      - ./src/proxy/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro,Z
      - ./src/proxy/static:/usr/share/nginx/html:ro,Z
    depends_on:
      - dashboard
      - production
      - manutention
      - qualite
      - techniciens
    networks:
      - plast-network
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-main:
    container_name: plast-db
    build:
      context: .
      dockerfile: src/database/dockerfile.postgres
    env_file:
      - src/database/.env.postgres
    networks:
      - plast-network
      - plast-secure
      - plast-migrations
    volumes:
      - plast-db-data:/var/lib/postgresql
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres} -h localhost -p 5432 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  production:
    container_name: plast-production
    build:
      context: .
      dockerfile: src/apis/production/dockerfile.prod
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - plast-network
    restart: on-failure:5

  manutention:
    container_name: plast-manutention
    build:
      context: .
      dockerfile: src/apis/manutention/dockerfile.manut
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - plast-network
    restart: on-failure:5

  techniciens:
    container_name: plast-techniciens
    build:
      context: .
      dockerfile: src/apis/technicians/dockerfile.tech
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - plast-network
    restart: on-failure:5
  qualite:
    container_name: plast-qualite
    build:
      context: .
      dockerfile: src/apis/quality/dockerfile.quality
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - plast-network
    restart: on-failure:5

  dashboard:
    container_name: plast-dashboard
    build:
      context: .
      dockerfile: src/apis/dashbord/dockerfile.dashboard
    env_file:
      - src/database/.env.postgres
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY doit être définie}
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
    depends_on:
      db-main:
        condition: service_healthy
    networks:
      - plast-network
      - plast-secure
    restart: on-failure:5

volumes:
  plast-db-data:
    driver: local

networks:
  plast-network:
    driver: bridge
  plast-secure:
    driver: bridge
  plast-migrations:
    driver: bridge